# Hooks cover every extension present in the repo: .py, .ts, .mjs, .json,
# .yaml, .sql, .toml, .md and Dockerfile. Adding a new file type to the project
# means adding its hook here (see CLAUDE.md section 5).

default_install_hook_types: [pre-commit, commit-msg]

exclude: '^mcp-server/package-lock\.json$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      # CHANGELOG.md is generated by `cz bump`. Reformatting it would make
      # every release commit fail its own hooks, so the formatting hooks skip
      # it while the ASCII and safety checks below still apply.
      - id: end-of-file-fixer
        exclude: ^CHANGELOG\.md$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  # Enforces the pure ASCII rule (CLAUDE.md section 3) mechanically. A pygrep
  # hook fails when its pattern matches, so any non-ASCII byte blocks the
  # commit instead of waiting to be caught in review.
  - repo: local
    hooks:
      - id: ascii-only
        name: ascii only
        description: Reject non-ASCII characters in tracked text files
        language: pygrep
        entry: '[^\x00-\x7f]'
        types: [text]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # eslint and tsc run from mcp-server/node_modules rather than from an
  # isolated hook environment: eslint.config.mjs imports @eslint/js and
  # typescript-eslint, and ESM resolves those relative to the config file.
  # Versions are therefore pinned in mcp-server/package.json.
  - repo: local
    hooks:
      - id: mcp-check
        name: eslint and tsc (mcp-server)
        description: Lint and type-check the MCP server sources
        language: script
        entry: scripts/mcp-check.sh
        files: ^mcp-server/(src/.*\.ts|package(-lock)?\.json|tsconfig\.json|eslint\.config\.mjs)$
        pass_filenames: false

  # The upstream pre-commit/mirrors-prettier repo is archived; this fork tracks
  # current prettier releases.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.5.1
    hooks:
      - id: prettier
        types_or: [ts, javascript, json, yaml, markdown]
        # .cz.yaml is rewritten by `cz bump` through PyYAML, which sorts the
        # keys and does not indent block sequences. Prettier disagrees on both,
        # so leaving it in would break every release commit.
        exclude: ^(CHANGELOG\.md|\.cz\.yaml)$

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        # The generated changelog opens at `## v<version>`, which trips MD041.
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.1
    hooks:
      - id: sqlfluff-lint
        files: ^migrations/.*\.sql$

  # Rejects commit messages that were not produced by `cz c` (CLAUDE.md
  # section 6).
  # Must stay >= 4.9: wyld-cz requires commitizen >=4.9,<5, and the hook env
  # installs both.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        additional_dependencies: ["wyld-cz>=0.2.1"]
