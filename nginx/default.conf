# The single entry point. Everything the stack serves over HTTP is reached
# through this one listener, routed by path prefix.

# Names are resolved per request through Docker's embedded DNS, which is why
# every proxy_pass below goes through a variable: worker-api sits behind the
# `remote` profile, and a static upstream name that does not resolve makes
# nginx refuse to start rather than answer 502 for that one path.
resolver 127.0.0.11 valid=10s ipv6=off;

# A TLS proxy in front of this one says so; without one the scheme is ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# With enforcement off the client's own header reaches every upstream, as before.
map $auth_enforce $forwarded_authorization {
    off $http_authorization;
    default $auth_authorization;
}

# Registering and claiming take no credential, so an address gets a budget. An
# agent polls its claim every 10 s; this leaves room for a few behind one NAT.
limit_req_zone $binary_remote_addr zone=agent_enroll:1m rate=60r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
}

server {
    listen 80;
    server_name _;

    set $mcp_server http://mcp-server:3000;
    set $worker_api http://worker-api:3003;
    set $dashboard http://web:3002;
    set $rauthy http://rauthy:8080;

    # The dashboard API accepts a 2 MB JSON body; the rest send far less.
    client_max_body_size 8m;

    # Every request is asked about first; the exempt locations switch it off.
    # The answer's headers replace any X-Auth-* the client sent, and an empty
    # one is not passed on at all.
    auth_request /_auth/check;
    auth_request_set $auth_kind $upstream_http_x_auth_kind;
    auth_request_set $auth_subject $upstream_http_x_auth_subject;
    auth_request_set $auth_role $upstream_http_x_auth_role;
    auth_request_set $auth_scopes $upstream_http_x_auth_scopes;
    auth_request_set $auth_projects $upstream_http_x_auth_projects;
    auth_request_set $auth_authorization $upstream_http_x_auth_authorization;
    auth_request_set $auth_host $upstream_http_x_auth_host;

    proxy_http_version 1.1;
    # Passed through unchanged: both the MCP server and the dashboard check
    # this header themselves, and rewriting it would defeat those checks.
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Auth-Kind $auth_kind;
    proxy_set_header X-Auth-Subject $auth_subject;
    proxy_set_header X-Auth-Role $auth_role;
    proxy_set_header X-Auth-Scopes $auth_scopes;
    proxy_set_header X-Auth-Projects $auth_projects;
    proxy_set_header X-Auth-Host $auth_host;
    # Only /worker/ gets one back: the internal token once the check passed,
    # the client's own while the request is anonymous.
    proxy_set_header Authorization $forwarded_authorization;

    location = /_auth/check {
        internal;
        auth_request off;
        # Off asks nobody, so the gateway keeps working while the dashboard is down.
        if ($auth_enforce = off) {
            return 204;
        }
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_pass $dashboard/auth/check;
    }

    location = /nginx/health {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        auth_request off;
        proxy_pass $mcp_server;
    }

    location = /auth/check {
        auth_request off;
        return 404;
    }

    location ~ ^/auth/(login|callback|logout)$ {
        auth_request off;
        proxy_pass $dashboard;
    }

    # An MCP client probing for OAuth must get the dashboard's plain 404.
    location /.well-known/ {
        auth_request off;
        proxy_pass $dashboard;
    }

    # What the login page itself needs before anyone is logged in.
    location /static/ {
        auth_request off;
        proxy_pass $dashboard;
    }

    # Rauthy, under the `auth` profile; 502 while it does not run.
    location /auth/v1/ {
        auth_request off;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass $rauthy;
    }

    # /mcp, /mcp/<project>, /sse, /sse/<project> and the SSE write channel.
    # Buffering off because both transports hold a response open: buffered,
    # the client sees nothing until the session ends.
    location ~ ^/(mcp|sse)(/|$) {
        error_page 401 = @bearer;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        proxy_pass $mcp_server;
    }

    location = /message {
        error_page 401 = @bearer;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass $mcp_server;
    }

    location = /worker {
        return 301 /worker/;
    }

    # Between the stack's own services: this is how they read a tree through
    # its agent, and the check above would hand it the internal token.
    location ^~ /worker/internal/ {
        return 404;
    }

    location /worker/ {
        error_page 401 = @bearer;
        # A proxy_pass whose target is a variable does not strip the location
        # prefix the way a literal one does, so the rewrite does it instead.
        rewrite ^/worker/(.*)$ /$1 break;
        proxy_pass $worker_api;
    }

    # Host agents sign every request, so nothing here asks about them.
    location ~ ^/agent/agents/(register|claim)$ {
        auth_request off;
        limit_req zone=agent_enroll burst=20 nodelay;
        limit_req_status 429;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass $worker_api;
    }

    # A proxy_set_header here replaces the server's, so the socket's are all named.
    location /agent/agents/ {
        auth_request off;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass $worker_api;
    }

    # A tool call from the Ask page may outlast the default 60s read timeout.
    location = /api/ask {
        error_page 401 = @json;
        proxy_read_timeout 200s;
        proxy_pass $dashboard;
    }

    location /api/ {
        error_page 401 = @json;
        proxy_pass $dashboard;
    }

    # The dashboard owns every other address: its pages, the viewer page it
    # proxies and its client-side routes.
    location / {
        error_page 401 = @login;
        proxy_pass $dashboard;
    }

    location @login {
        auth_request off;
        # htmx would follow a 302 and swap the login page into a fragment.
        if ($http_hx_request) {
            add_header HX-Redirect /auth/login always;
            return 401;
        }
        return 302 /auth/login?next=$uri;
    }

    location @json {
        auth_request off;
        default_type application/json;
        return 401 '{"error": "Log in first: no session and no token"}';
    }

    location @bearer {
        auth_request off;
        add_header WWW-Authenticate 'Bearer realm="enggraph"' always;
        default_type text/plain;
        return 401 "A token is required: Authorization: Bearer egt_...\n";
    }
}
