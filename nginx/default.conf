# The single entry point. Everything the stack serves over HTTP is reached
# through this one listener, routed by path prefix.

# Names are resolved per request through Docker's embedded DNS, which is why
# every proxy_pass below goes through a variable: worker-api sits behind the
# `remote` profile, and a static upstream name that does not resolve makes
# nginx refuse to start rather than answer 502 for that one path.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $mcp_server http://mcp-server:3000;
    set $worker_api http://worker-api:3003;
    set $dashboard http://web:3002;

    # The dashboard API accepts a 2 MB JSON body; the rest send far less.
    client_max_body_size 8m;

    proxy_http_version 1.1;
    # Passed through unchanged: both the MCP server and the dashboard check
    # this header themselves, and rewriting it would defeat those checks.
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        proxy_pass $mcp_server;
    }

    # /mcp, /mcp/<project>, /sse, /sse/<project> and the SSE write channel.
    # Buffering off because both transports hold a response open: buffered,
    # the client sees nothing until the session ends.
    location ~ ^/(mcp|sse)(/|$) {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        proxy_pass $mcp_server;
    }

    location = /message {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass $mcp_server;
    }

    location = /worker {
        return 301 /worker/;
    }

    location /worker/ {
        # A proxy_pass whose target is a variable does not strip the location
        # prefix the way a literal one does, so the rewrite does it instead.
        rewrite ^/worker/(.*)$ /$1 break;
        proxy_pass $worker_api;
    }

    # The dashboard owns every other address: its API, the viewer page it
    # proxies, its static assets and its client-side routes.
    location / {
        proxy_pass $dashboard;
    }
}
