[pytest]
# Every package lives under a src root of its own; listing them here is what
# lets the suite run from a checkout with nothing installed. core/tests joins
# them for the fakes other packages' tests import from test_storage.
pythonpath =
    packages/core/src
    packages/indexer/src
    packages/api/src
    packages/embed/src
    packages/summarize/src
    packages/viewer/src
    packages/core/tests
testpaths = packages
markers =
    db: needs EVAL_DATABASE_URL, a migrated throwaway database
