name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: mcp-server typecheck and unit tests
        working-directory: mcp-server
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # llama-cpp-python is a source build; tests/conftest.py stubs it.
      - name: graphify unit tests
        working-directory: graphify
        run: |
          grep -v '^llama-cpp-python' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt -r requirements-dev.txt
          pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: unit
    env:
      TAG: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the images under test
        run: |
          docker build -t ghcr.io/oberon-systems/enggraph/graphify:ci graphify
          docker build -t ghcr.io/oberon-systems/enggraph/mcp-server:ci mcp-server

      - name: Install the test dependencies
        run: |
          python -m venv .venv
          grep -v '^llama-cpp-python' graphify/requirements.txt > /tmp/requirements.txt
          .venv/bin/pip install -r /tmp/requirements.txt -r graphify/requirements-dev.txt
          (cd mcp-server && npm ci)

      - name: Start the eval stack
        run: make eval-up

      - name: Benchmark, SQL and MCP checks
        run: make eval

      - name: Keep the benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/

      - name: Stop the eval stack
        if: always()
        run: make eval-down
