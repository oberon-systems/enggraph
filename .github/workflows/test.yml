name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python unit tests
        run: |
          pip install -r requirements-dev.txt \
            -e packages/core -e packages/indexer -e packages/api \
            -e packages/embed -e packages/summarize -e packages/viewer \
            -e packages/mcp -e packages/web
          pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: unit
    env:
      TAG: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the images under test
        run: |
          docker build -f packages/api/Dockerfile -t ghcr.io/oberon-systems/enggraph/api:ci .
          docker build -f packages/mcp/Dockerfile -t ghcr.io/oberon-systems/enggraph/mcp:ci .
          docker build -f packages/web/Dockerfile -t ghcr.io/oberon-systems/enggraph/web:ci .

      - name: Install the test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt \
            -e packages/core -e packages/indexer -e packages/api \
            -e packages/embed -e packages/summarize -e packages/viewer \
            -e packages/mcp -e packages/web

      - name: Start the eval stack
        run: make eval-up

      - name: Benchmark, SQL and MCP checks
        run: make eval

      - name: Keep the benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/

      - name: Stop the eval stack
        if: always()
        run: make eval-down
