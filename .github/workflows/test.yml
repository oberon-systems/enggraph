name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Python unit tests
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps --no-build-isolation \
            -e packages/core -e packages/indexer -e packages/api \
            -e packages/embed -e packages/summarize -e packages/viewer \
            -e packages/mcp -e packages/web
          pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: unit
    env:
      TAG: ci
      RUST_VERSION: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the images under test
        run: |
          docker build -f packages/api/Dockerfile -t ghcr.io/oberon-systems/enggraph/api:ci .
          docker build -f packages/mcp/Dockerfile -t ghcr.io/oberon-systems/enggraph/mcp:ci .
          docker build -f packages/web/Dockerfile -t ghcr.io/oberon-systems/enggraph/web:ci .

      - name: Install the test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
          .venv/bin/pip install --no-deps --no-build-isolation \
            -e packages/core -e packages/indexer -e packages/api \
            -e packages/embed -e packages/summarize -e packages/viewer \
            -e packages/mcp -e packages/web

      - name: Install the host agent's toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake musl-tools
          rustup toolchain install "$RUST_VERSION" --profile minimal -t "$(uname -m)-unknown-linux-musl"
          rustup default "$RUST_VERSION"

      - name: Start the eval stack
        run: make eval-up

      - name: Benchmark, SQL and MCP checks
        run: make eval

      - name: Keep the benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: eval/results/

      - name: Stop the eval stack
        if: always()
        run: make eval-down
