name: Agent

on:
  pull_request:
    paths:
      - packages/agent/**
      - packages/core/tests/data/**
      - .github/workflows/agent.yml
  push:
    tags:
      - enggraph-agent-*

permissions:
  contents: read

env:
  RUST_VERSION: 1.98.1

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt -c clippy
          rustup default "$RUST_VERSION"
      - name: Format
        run: make agent-fmt
      - name: Clippy
        run: make agent-clippy
      - name: Test
        run: make agent-test

  version:
    if: startsWith(github.ref, 'refs/tags/enggraph-agent-')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        id: check
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/agent/Cargo.toml)"
          test "$GITHUB_REF_NAME" = "enggraph-agent-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake musl-tools
          rustup toolchain install "$RUST_VERSION" --profile minimal -t "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Build
        run: make agent AGENT_TARGET="$TARGET"
      # A static-pie binary, which is what musl builds, satisfies ldd as well.
      - name: Check the binary is static
        run: |
          if readelf -d "packages/agent/target/$TARGET/release/enggraph-agent" | grep -q NEEDED; then
            exit 1
          fi
      - name: Name the binary
        run: |
          mkdir dist
          cp "packages/agent/target/$TARGET/release/enggraph-agent" \
            "dist/enggraph-agent-$VERSION-$ARCH-linux-musl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enggraph-agent-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum enggraph-agent-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$(awk -v head="## $GITHUB_REF_NAME " \
            'index($0, head) == 1 { keep = 1; next } /^## / { keep = 0 } keep' \
            packages/agent/CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --latest=false \
            --notes "${notes:-enggraph-agent $VERSION on crates.io.}"

  crates-io:
    needs: [version, release]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --manifest-path packages/agent/Cargo.toml
