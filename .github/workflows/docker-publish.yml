name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*.*.0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true
        default: "v0.1.0"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ inputs.tag || github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push embed
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/embed/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/embed:${{ inputs.tag || github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/embed:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push summarize
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/summarize/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/summarize:${{ inputs.tag || github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/summarize:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push viewer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/viewer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/viewer:${{ inputs.tag || github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/viewer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mcp-server
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-server:${{ inputs.tag || github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ inputs.tag || github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
