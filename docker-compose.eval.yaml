# Throwaway stack for `make eval`: its own database on tmpfs, migrated, with
# eval/corpus/alpha and eval/corpus/beta indexed under those names, an MCP
# server and the dashboard over them. beta takes what alpha provides, which is what links them.
# A host agent `scripts/eval-agent.sh` starts serves the corpus, as on any stack.
# Nothing here touches the main stack's volume, network or ports.

name: enggraph-eval

x-database-url: &database-url postgresql://eval@postgres:5432/eval

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: eval
      POSTGRES_USER: eval
      # Loopback only and gone on `make eval-down`; no credential to keep.
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - 127.0.0.1:${EVAL_DB_PORT:-55432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U eval -d eval]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    image: ghcr.io/oberon-systems/enggraph/api:${TAG:-latest}
    restart: "no"
    command: [python, -m, enggraph.core.migrate]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  indexer: &indexer
    image: ghcr.io/oberon-systems/enggraph/api:${TAG:-latest}
    restart: "no"
    command: [python, -m, enggraph.indexer]
    environment:
      DATABASE_URL: *database-url
      WORKER_API_URL: http://worker-api:3003
      WORKER_API_TOKEN: eval-stack-worker-api-token
      PROJECT_ROOT: ${EVAL_CORPUS:-/eval}/alpha
      PROJECT_NAME: alpha
    profiles: [index]
    depends_on:
      worker-api:
        condition: service_healthy

  indexer-beta:
    <<: *indexer
    environment:
      DATABASE_URL: *database-url
      WORKER_API_URL: http://worker-api:3003
      WORKER_API_TOKEN: eval-stack-worker-api-token
      PROJECT_ROOT: ${EVAL_CORPUS:-/eval}/beta
      PROJECT_NAME: beta

  # worker-api imports the built-in skills on the real stack; here once.
  skills:
    image: ghcr.io/oberon-systems/enggraph/api:${TAG:-latest}
    restart: "no"
    command: [python, -m, enggraph.api.skills]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The MCP server keeps no file text: snippets, context source and
  # search_text read the corpora through this, which holds the agent's socket.
  worker-api:
    image: ghcr.io/oberon-systems/enggraph/api:${TAG:-latest}
    restart: "no"
    command: [python, -m, enggraph.api]
    environment:
      DATABASE_URL: *database-url
      WORKER_API_PORT: 3003
      WORKER_API_TOKEN: eval-stack-worker-api-token
      LIST_CACHE_DIR: /tmp/listing
      INDEX_SCHEDULER: "0"
      EMBED_LOOP: "0"
      SUMMARIZE_LOOP: "0"
      STATS_LOOP: "0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3003/health', timeout=3).status == 200 else 1)
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      migrate:
        condition: service_completed_successfully
      skills:
        condition: service_completed_successfully

  # What the real gateway does for an agent, and nothing else.
  gateway:
    image: nginx:1.30.6-alpine
    configs:
      - source: gateway
        target: /etc/nginx/conf.d/default.conf
    ports:
      - 127.0.0.1:${EVAL_GATEWAY_PORT:-53004}:80
    depends_on:
      worker-api:
        condition: service_healthy

  mcp-server:
    image: ghcr.io/oberon-systems/enggraph/mcp:${TAG:-latest}
    environment:
      DATABASE_URL: *database-url
      WORKER_API_URL: http://worker-api:3003
      WORKER_API_TOKEN: eval-stack-worker-api-token
      PORT: 3000
      ALLOWED_HOSTS: 127.0.0.1:${EVAL_MCP_PORT:-53000},localhost:${EVAL_MCP_PORT:-53000},mcp-server:3000
    ports:
      - 127.0.0.1:${EVAL_MCP_PORT:-53000}:3000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      migrate:
        condition: service_completed_successfully
      skills:
        condition: service_completed_successfully
      worker-api:
        condition: service_healthy

  # The dashboard, for `make parity-web`: its API over the same corpus.
  web:
    image: ghcr.io/oberon-systems/enggraph/web:${TAG:-latest}
    environment:
      DATABASE_URL: *database-url
      PORT: 3002
      API_URL: http://worker-api:3003
      API_TOKEN: eval-stack-worker-api-token
      MCP_URL: http://mcp-server:3000
      WEB_ALLOWED_HOSTS: 127.0.0.1:${EVAL_WEB_PORT:-53002},localhost:${EVAL_WEB_PORT:-53002},web:3002
    ports:
      - 127.0.0.1:${EVAL_WEB_PORT:-53002}:3002
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # The guard answers only the hosts it was given, and this is one.
        - import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:3002/api/health', headers={'Host':'web:3002'}), timeout=3)
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      mcp-server:
        condition: service_healthy

configs:
  gateway:
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        "" close;
      }
      server {
        listen 80;
        location /agent/agents/ {
          proxy_http_version 1.1;
          proxy_set_header Host $$http_host;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          rewrite ^/agent/(.*)$$ /$$1 break;
          proxy_pass http://worker-api:3003;
        }
      }
