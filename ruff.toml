target-version = "py311"
line-length = 88
# Every package lives under a src root of its own, so isort is told where the
# first-party `enggraph` namespace is. Setting this replaces the default.
src = [".", "packages/*/src"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import ordering
    "B",   # bugbear
    "UP",  # pyupgrade
    "ANN", # explicit annotations, required by CLAUDE.md section 6
    "D",   # docstrings
]
ignore = [
    "D203", # incompatible with D211
    "D213", # incompatible with D212
]

[lint.pydocstyle]
convention = "pep257"
