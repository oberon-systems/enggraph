name: claude-context-mcp

x-database-url: &database-url postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-context}

# The same database, spelled for goose: its driver does not default sslmode
# the way libpq does, and nothing on this bridge speaks TLS.
x-goose-dbstring: &goose-dbstring postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-context}?sslmode=disable

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-context}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
    volumes:
      - ${HOME}/.local/share/context-mcp/db:/var/lib/postgresql/data
    networks: [base]
    healthcheck:
      test:
        - CMD-SHELL
        # Over TCP, not the socket: while the entrypoint initialises a new
        # data directory its temporary server listens on the socket alone.
        - pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-context}
      interval: 5s
      timeout: 5s
      retries: 5

  # Owns the schema. Runs to completion before anything else reaches the
  # database, so a plain `docker compose up` migrates on its own.
  #
  # GOOSE_COMMAND is fixed rather than read from the environment: a stray
  # variable on the host must not change what `up` does to the schema. The
  # other verbs come from `make db <target>`, which overrides it per run.
  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.27.2
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *goose-dbstring
      GOOSE_COMMAND: up
      # goose calls this table goose_db_version; this is the name ROADMAP
      # asked for, and renaming it is what GOOSE_TABLE is for.
      GOOSE_TABLE: schema_migrations
    volumes:
      - ./migrations:/migrations:ro
    networks: [base]
    depends_on:
      postgres:
        condition: service_healthy

  # Code graph indexer. Runs to completion and exits. Code is extracted by
  # graphifyy (https://github.com/Graphify-Labs/graphify), used as a library;
  # the infrastructure formats it does not read are parsed by the ctxgraph
  # package in ./graphify/src. Both write to the same database.
  graphify:
    image: ghcr.io/oberon-systems/claude-context-mcp/graphify:latest
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      # Where a tree is read before it is a project: the bootstrap scan runs
      # against a checkout with no row and no name yet. Indexing reads
      # CODE_ROOT/<project> instead, mounted by the generated override.
      TARGET_PROJECT_PATH: /project
      CODE_ROOT: /code
      # The host path travels separately so the projects table can record
      # where the graph came from, and the name is derived from it unless one
      # is given.
      PROJECT_ROOT: ${PROJECT_PATH}
      PROJECT_NAME: ${PROJECT_NAME:-}
      # Set by `make index TYPE=docs`: what kind of project this is, which is
      # what the cross-project MCP search narrows on. Empty keeps the stored
      # one, so a plain re-index never demotes a project to the default.
      PROJECT_TYPE: ${PROJECT_TYPE:-}
      # Set by `make index FRESH=1`: re-extract every file rather than trust
      # either cache. Named here or it would reach compose and not the job.
      FORCE_REEXTRACT: ${FORCE_REEXTRACT:-}
      # Set by `make index SUMMARIZE=1`: describe each file with the model as
      # the run goes. `make summarize` does the same work on its own instead.
      SUMMARIZE: ${SUMMARIZE:-}
      # Which weights to load, and how many files to stop after. Both are set
      # per run by the make targets; empty means the one model mounted below
      # and no limit.
      LLM_MODEL_PATH: ${LLM_MODEL_PATH:-}
      SUMMARY_LIMIT: ${SUMMARY_LIMIT:-}
      # Threads llama.cpp runs the summarizing model on. Kept at or below the
      # cpu quota below: threads oversubscribed against a quota buy context
      # switches, not throughput.
      LLM_THREADS: ${LLM_THREADS:-2}
    volumes:
      # Read-only by contract: the indexer must never mutate host sources.
      # Only the bootstrap scan reads this one; every indexed tree arrives at
      # /code/<project> through docker-compose.override.yaml, which
      # `make mounts` writes.
      - ${PROJECT_PATH}:/project:ro
      - graph-out:/app/graphify-out
      # The summarizer weights, put there by `make llm-model-install`.
      - ${HOME}/.local/share/context-mcp/models:/models:ro
    # The summarizing pass is the only thing here that can take the machine
    # with it: a 1.7B model over every file, unattended, for as long as the
    # tree is large. The floor is the weights (~1.1 GB) plus the context
    # window plus the extraction, so 4g is small rather than generous.
    cpus: ${GRAPHIFY_CPUS:-2}
    mem_limit: ${GRAPHIFY_MEM:-4g}
    mem_reservation: ${GRAPHIFY_MEM_RESERVATION:-1g}
    networks: [base]
    profiles: [index]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Renders the graph as a page, from the database, on every request. Shares
  # the indexer image because it calls the same rendering code.
  viewer:
    image: ghcr.io/oberon-systems/claude-context-mcp/graphify:latest
    restart: unless-stopped
    command: ["python", "-m", "ctxgraph.viewer"]
    environment:
      DATABASE_URL: *database-url
      VIEWER_PORT: 3001
    networks: [base]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The API: the only service that reads files, and the queue a summarizing
  # worker on another machine claims work from. Same image as the indexer, run
  # as another module, the way the viewer is. Reached through the ingress at
  # /worker, from off this host as well - the GPU that answers it is elsewhere
  # - which is why it carries a token of its own. It holds the same /code
  # mounts as the indexer, because a file node names a file and something has
  # to be able to read it.
  worker-api:
    image: ghcr.io/oberon-systems/claude-context-mcp/graphify:latest
    restart: unless-stopped
    command: ["python", "-m", "ctxgraph.workerapi"]
    environment:
      DATABASE_URL: *database-url
      WORKER_API_PORT: 3003
      # No compose-level `:?` guard: an unset token must stop this service
      # alone, not every `make index` on a stack that never publishes it.
      # The application refuses to start without one.
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
      WORKER_MAX_BATCH: ${WORKER_MAX_BATCH:-8}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      CODE_ROOT: /code
    networks: [base]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # python, not curl: the runtime image is python:3.11-slim and carries
      # neither curl nor wget.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3003/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The dashboard: indexed projects, their nodes, and every plan in the
  # database. The graph itself is the viewer's page, proxied through here so it
  # and the API share one origin.
  web:
    image: ghcr.io/oberon-systems/claude-context-mcp/web:latest
    restart: unless-stopped
    networks: [base]
    environment:
      DATABASE_URL: *database-url
      PORT: 3002
      VIEWER_URL: http://viewer:3001
      # File text comes from the API, which owns the mounts and the deny list.
      API_URL: http://worker-api:3003
      API_TOKEN: ${WORKER_API_TOKEN:-}
      # Behind the ingress the Host header carries the gateway's port, not
      # this service's, so the built-in default would refuse every request.
      WEB_ALLOWED_HOSTS: ${GATEWAY_HOSTS:-localhost:3000,127.0.0.1:3000,[::1]:3000},web:3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      viewer:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MCP server exposed to Claude CLI over Streamable HTTP.
  mcp-server:
    image: ghcr.io/oberon-systems/claude-context-mcp/mcp-server:latest
    restart: unless-stopped
    networks: [base]
    environment:
      DATABASE_URL: *database-url
      PORT: 3000
      # Behind the ingress the Host header carries the gateway's port, not
      # this service's, so the built-in default would refuse every request.
      ALLOWED_HOSTS: ${GATEWAY_HOSTS:-localhost:3000,127.0.0.1:3000,[::1]:3000},mcp-server:3000
      # Relative on purpose: the graph page is served by the dashboard, on the
      # gateway, and the viewer has no address of its own any more.
      VIEWER_URL: /graph
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The single entry point. Nothing else here publishes a port: nginx routes
  # by path to the MCP server, the worker API and the dashboard. Binding every
  # interface is what a remote summarization worker needs, and it also puts
  # the dashboard - which writes to the database on behalf of a browser and
  # has no authentication of its own - within reach of the local network.
  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-3000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [base]
    # worker-api is deliberately absent: naming it here would pull the remote
    # profile into every plain `up`. Its route answers 502 until it runs.
    depends_on:
      mcp-server:
        condition: service_started
      web:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=-",
          "http://127.0.0.1/nginx/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  graph-out:

# No fixed subnet: nothing here addresses a container by ip, and a pinned range
# would stop a second stack from starting at all, however the compose projects
# are named.
networks:
  base:
    driver: bridge
