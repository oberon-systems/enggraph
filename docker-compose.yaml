name: claude-context-mcp

x-database-url: &database-url postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-context}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-context}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
    volumes:
      - ${DATA_DIR:-./pgdata}:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks: [base]
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-context}
      interval: 5s
      timeout: 5s
      retries: 5

  # Code graph indexer. Runs to completion and exits. Code is extracted by
  # graphifyy (https://github.com/Graphify-Labs/graphify), used as a library;
  # the infrastructure formats it does not read are parsed by the ctxgraph
  # package in ./graphify/src. Both write to the same database.
  graphify:
    build:
      context: ./graphify
    image: claude-context-mcp/graphify:${TAG:-dev}
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      TARGET_PROJECT_PATH: /project
      # The mount is always /project inside the container, which says nothing
      # about which codebase it holds. The host path travels separately so the
      # projects table can record where the graph came from, and the name is
      # derived from it unless one is given.
      PROJECT_ROOT: ${PROJECT_PATH}
      PROJECT_NAME: ${PROJECT_NAME:-}
    volumes:
      # Read-only by contract: the indexer must never mutate host sources.
      - ${PROJECT_PATH}:/project:ro
      - graph-out:/app/graphify-out
    networks: [base]
    profiles: [index]
    depends_on:
      postgres:
        condition: service_healthy

  # Renders the graph as a page, from the database, on every request. Shares
  # the indexer image because it calls the same rendering code.
  viewer:
    image: claude-context-mcp/graphify:${TAG:-dev}
    restart: unless-stopped
    command: ["python", "-m", "ctxgraph.viewer"]
    ports:
      - "${VIEWER_PORT:-3001}:3001"
    environment:
      DATABASE_URL: *database-url
      VIEWER_PORT: 3001
    networks: [base]
    depends_on:
      postgres:
        condition: service_healthy

  # MCP server exposed to Claude CLI over SSE.
  mcp-server:
    build:
      context: ./mcp-server
    image: claude-context-mcp/mcp-server:${TAG:-dev}
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3000}:3000"
    networks: [base]
    environment:
      DATABASE_URL: *database-url
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  graph-out:

# No fixed subnet: nothing here addresses a container by ip, and a pinned range
# would stop a second stack from starting at all, however the compose projects
# are named.
networks:
  base:
    driver: bridge
