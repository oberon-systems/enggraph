---
commitizen:
  allowed_prefixes:
  - Merge
  - Revert
  - Pull request
  - fixup!
  - squash!
  - amend!
  - 'bump:'
  bump_message: 'bump: version $current_version -> $new_version'
  name: wyld_cz
  pre_bump_hooks:
  - make --no-print-directory agent-lock
  tag_format: v$version
  update_changelog_on_bump: true
  version: 2.0.0
  version_files:
  - packages/*/pyproject.toml:^version
  - packages/*/pyproject.toml:enggraph-
  - packages/agent/Cargo.toml:^version
