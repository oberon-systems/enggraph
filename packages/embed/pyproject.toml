[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-embed"
version = "1.0.0"
description = "The enggraph service that drains the embedding queue."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core==1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
