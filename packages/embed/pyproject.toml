[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "enggraph-embed"
version = "3.1.0"
description = "The enggraph service that drains the embedding queue."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core==3.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
