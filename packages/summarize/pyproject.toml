[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-summarize"
version = "2.0.0"
description = "The enggraph service that pushes the summary queue to a model server."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core==2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
