[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-web"
version = "2.0.0"
description = "The enggraph dashboard: the projects, their graphs and the records, as pages."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core==2.0.0",
    "anyio==4.15.1",
    "authlib==1.9.1",
    "fastapi==0.161.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "joserfc==1.7.7",
    "markdown-it-py==4.2.0",
    "mcp==1.30.0",
    "nh3==0.3.7",
    "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
