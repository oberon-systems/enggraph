[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-web"
version = "1.0.0"
description = "The enggraph dashboard: the projects, their graphs and the records, as pages."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core==1.0.0",
    "anyio==4.15.1",
    "fastapi==0.121.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "markdown-it-py==4.0.0",
    "mcp==1.30.0",
    "nh3==0.3.2",
    "uvicorn==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
