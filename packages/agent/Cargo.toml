[package]
name = "enggraph-agent"
version = "2.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
readme = "README.md"
description = "Host agent for enggraph: enrolls with a stack and holds one signed socket to it"

[dependencies]
clap = { version = "=4.6.1", features = ["derive", "env"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
hex = "=0.4.3"
hmac = "=0.13.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
toml = "=1.1.2"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
wiremock = "=0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
