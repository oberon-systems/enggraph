[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "enggraph-api"
version = "2.0.0"
description = "The enggraph worker API: index runs, the schedule, file text, summary leases."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core==2.0.0",
    "enggraph-indexer==2.0.0",
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "websockets==15.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
