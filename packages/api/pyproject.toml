[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-api"
version = "1.0.0"
description = "The enggraph worker API: index runs, the schedule, file text, summary leases."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core==1.0.0",
    "enggraph-indexer==1.0.0",
    "diskcache==5.6.3",
    "fastapi==0.121.1",
    "uvicorn==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
