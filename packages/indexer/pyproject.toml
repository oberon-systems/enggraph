[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-indexer"
version = "0.23.0"
description = "Build a code graph from a project tree and store it in PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core[graph]==0.23.0",
    "PyYAML==6.0.3",
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-css==0.25.0",
    "tree-sitter-dockerfile==0.2.0",
    "tree-sitter-embedded-template==0.25.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-hcl==1.2.0",
    "tree-sitter-html==0.23.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-json==0.24.8",
    "tree-sitter-make==1.1.1",
    "tree-sitter-markdown==0.5.1",
    "tree-sitter-php==0.24.1",
    "tree-sitter-puppet==1.3.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-toml==0.7.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-yaml==0.7.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
