[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-core"
version = "1.0.0"
description = "What every enggraph service shares: settings, storage, queues, trees."
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "pathspec==1.1.1",
    "pgvector==0.5.0",
    "psycopg2-binary==2.9.12",
    "sqlmodel==0.0.48",
    "valkey==6.1.1",
    "watchfiles==1.1.1",
]

# What enggraph.core.graphs imports, needed by the indexer and the viewer alone.
[project.optional-dependencies]
graph = [
    "networkx==3.6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
