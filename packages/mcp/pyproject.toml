[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-mcp"
version = "1.0.0"
description = "The enggraph MCP server: the graph, the records and the skills, as tools."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core==1.0.0",
    "anyio==4.15.1",
    "mcp==1.30.0",
    "starlette==0.49.3",
    "uvicorn==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
