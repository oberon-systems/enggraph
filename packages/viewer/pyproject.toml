[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enggraph-viewer"
version = "2.0.0"
description = "The enggraph service that draws the stored graph as a page."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core[graph]==2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
