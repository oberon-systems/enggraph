[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "enggraph-viewer"
version = "3.1.0"
description = "The enggraph service that draws the stored graph as a page."
requires-python = ">=3.11"
dependencies = [
    "enggraph-core[graph]==3.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enggraph"]
